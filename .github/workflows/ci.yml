name: ThreatLens CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests
        run: |
          pytest -q

      - name: Compile source
        run: |
          python -m compileall src

      - name: Verify CLI
        run: |
          threatlens --help

      - name: Run benchmark
        run: |
          threatlens benchmark
