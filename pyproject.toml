[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens"
version = "0.2.0"
description = "AI-powered behavioral threat detection CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "Samiksha Jangid"}]

dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "psutil>=6.0,<8",
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "build>=1.6.1,<2",
    "pip-audit>=2.9,<3"
]

[project.scripts]
threatlens = "threatlens.cli.app:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/samiksha-jangid27/ThreatLens-CLI"
Documentation = "https://github.com/samiksha-jangid27/ThreatLens-CLI/tree/main/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"] # Typer options are evaluated when command signatures are declared.

[tool.coverage.run]
source = ["threatlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
